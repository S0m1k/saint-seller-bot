<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Saint Seller 812</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/styles.css?v=8" />
</head>
<body>
  <!-- Загрузочный экран -->
  <div id="splash" class="splash" aria-hidden="true">
    <img class="splash-logo" src="/static/logo.png?v=8" alt="Saint Seller 812" />
    <div class="splash-bar"><i></i></div>
    <div class="splash-caption">SAINT&nbsp;SELLER&nbsp;·&nbsp;812</div>
  </div>

  <!-- Фоновые вотермарки брендов (реальные векторы Stone Island / C.P. Company) -->
  <div class="bg-watermark" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <img id="brand-logo" class="brand-logo" src="/static/logo.png?v=8" alt="Saint Seller 812"
           onerror="this.remove();var f=document.getElementById('brand-fallback');if(f){f.style.display='flex';}" />
      <div id="brand-fallback" class="brand-fallback" style="display:none">
        <span class="brand-mark">SS</span>
        <span class="brand-name">Saint&nbsp;Seller <b>812</b></span>
      </div>
    </div>
    <button id="account-btn" class="icon-btn" aria-label="Профиль">
      <span class="ic" data-icon="user"></span>
    </button>
  </header>

  <div class="search-row" id="search-row">
    <div class="search-field">
      <span class="ic sm" data-icon="search"></span>
      <input id="search-input" type="search" inputmode="search" placeholder="Поиск: название или бренд" autocomplete="off" />
    </div>
    <button id="brand-btn" class="chip-filter" aria-label="Фильтр по бренду">
      <span>Бренд</span><span class="ic" data-icon="chevron"></span>
    </button>
  </div>

  <nav class="chips" id="category-chips"></nav>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button class="tab active" data-tab="catalog"><span class="ic" data-icon="bag"></span><small>Каталог</small></button>
    <button class="tab" data-tab="favorites"><span class="ic" data-icon="heart"></span><small>Избранное</small></button>
    <button class="tab" data-tab="cart"><span class="ic" data-icon="cart"></span><small>Корзина</small><b id="cart-badge" class="badge hidden">0</b></button>
    <button class="tab" data-tab="orders"><span class="ic" data-icon="receipt"></span><small>Заказы</small></button>
  </nav>

  <!-- Модалка товара -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" id="modal-card"></div>
  </div>

  <!-- Нижний лист (фильтр бренда / профиль) -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop" data-close-sheet></div>
    <div class="sheet-card" id="sheet-card"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js?v=8"></script>
</body>
</html>
